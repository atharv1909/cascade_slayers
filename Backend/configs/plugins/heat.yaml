  - { from: "PWR", to: "COM", lag_h: 6, mechanism: "physical", description: "Substation brownouts degrade cellular base transceiver stations" }
  - { from: "PWR", to: "HLT", lag_h: 8, mechanism: "physical", description: "Domestic power loss removes indoor fan/cooling relief" }
  - { from: "WX", to: "HOS", lag_h: 18, mechanism: "logical", description: "Delayed severe dehydration and heat hyperthermia hospital admissions" }
  - { from: "HOS", to: "EMS", lag_h: 6, mechanism: "logical", description: "Emergency department bed saturation diverts heat distress calls" }
seed_zones: ["z03_dharavi_ne", "z05_kurla_e", "z10_vakola"]
