id: "flood"
name: "Monsoon Inundation & Mithi River Drainage Collapse"
lead_semantics: "Real lead: 24–72 h from rain forecast + saturation + drainage state"
honest_statement: "Rain forecasts + catchment saturation provide physical early warning 24 to 72 hours ahead. The system predicts downstream drainage backup, arterial severance, and hospital access cutoff."
primary_layers: ["WX", "HYD", "TRF", "EMS", "HOS", "PWR", "COM"]
trigger_generator:
  event_type: "multiday_monsoon_storm"
  onset_hour: 48          # warm-up 48h, storm begins
  peak_intensity_mm_h: 88.0
  duration_h: 36
  antecedent_saturation: 0.82
critical_event:
  condition: "waterlogging_risk_index >= 0.55 for >= 2 h OR roads_accessible_pct <= 40.0"
expected_chain:
  - { from: "WX", to: "HYD", lag_h: 2, mechanism: "physical", description: "Runoff exceeds drain capacity" }
  - { from: "HYD", to: "TRF", lag_h: 4, mechanism: "physical", description: "Waterlogging blocks CST Rd & Bail Bazar arterial" }
  - { from: "HYD", to: "PWR", lag_h: 6, mechanism: "physical", description: "Substation flooding forces isolation tripping" }
  - { from: "TRF", to: "EMS", lag_h: 3, mechanism: "physical", description: "Ambulance transit times quadruple" }
  - { from: "EMS", to: "HOS", lag_h: 5, mechanism: "logical", description: "Delayed critical trauma arrivals and casualty diversion" }
  - { from: "PWR", to: "COM", lag_h: 8, mechanism: "cyber", description: "Cell towers deplete battery backup after grid loss" }
  - { from: "HOS", to: "EMS", lag_h: 4, mechanism: "logical", description: "Emergency diversion forces longer reroutes (feedback loop)" }
seed_zones: ["z04_kurla_w", "z02_dharavi_nw", "z08_kalina_s"]
