lead_semantics: "Two cascades share a bottleneck"
honest_statement: "Concurrent monsoon cloudburst and substation inundation produce a compound cascade. The joint failure probability exceeds the product of independent failure probabilities (interaction_gain > 1.0) due to shared hospital power and ambulance transit bottlenecks."
