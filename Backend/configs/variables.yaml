# Variables dictionary and physical bounds for Cascade_slayers (The 72-Hour Warning)
layers:
  WX:
    description: "Meteorological and ambient atmospheric conditions"
    variables:
      rain_mm_h: { unit: "mm/h", min: 0.0, max: 250.0, default: 0.0, physical_max: 300.0 }
      temp_c: { unit: "C", min: 10.0, max: 55.0, default: 28.0, physical_max: 60.0 }
      rh_pct: { unit: "%", min: 5.0, max: 100.0, default: 70.0, physical_max: 100.0 }
      wind_speed_mps: { unit: "m/s", min: 0.0, max: 60.0, default: 4.0, physical_max: 80.0 }
      wind_dir_deg: { unit: "deg", min: 0.0, max: 360.0, default: 240.0, physical_max: 360.0 }
      wbgt_c: { unit: "C", min: 10.0, max: 45.0, default: 25.0, physical_max: 50.0 }

  HYD:
    description: "Drainage networks, canal levels, surface water storage"
    variables:
      drain_load_ratio: { unit: "ratio", min: 0.0, max: 3.0, default: 0.15, physical_max: 5.0 }
      canal_level_m: { unit: "m", min: 0.0, max: 8.0, default: 1.2, physical_max: 12.0 }
      waterlogging_risk_index: { unit: "index", min: 0.0, max: 1.0, default: 0.02, physical_max: 1.0 }

  TRF:
    description: "Road network velocity and emergency accessibility"
    variables:
      speed_index: { unit: "index", min: 0.0, max: 1.0, default: 0.85, physical_max: 1.0 }
      roads_accessible_pct: { unit: "%", min: 0.0, max: 100.0, default: 98.0, physical_max: 100.0 }

  PWR:
    description: "Electrical grid demand, substation loading, customer outages"
    variables:
      load_ratio: { unit: "ratio", min: 0.0, max: 2.5, default: 0.55, physical_max: 3.0 }
      substation_loading: { unit: "%", min: 0.0, max: 200.0, default: 60.0, physical_max: 250.0 }
      customers_out_pct: { unit: "%", min: 0.0, max: 100.0, default: 0.5, physical_max: 100.0 }

  EMS:
    description: "Emergency dispatch, call volumes, and fleet availability"
    variables:
      call_rate_per_k: { unit: "calls/k/h", min: 0.0, max: 50.0, default: 1.2, physical_max: 100.0 }
      response_time_min: { unit: "min", min: 4.0, max: 120.0, default: 11.5, physical_max: 240.0 }
      units_unavailable_pct: { unit: "%", min: 0.0, max: 100.0, default: 10.0, physical_max: 100.0 }

  HOS:
    description: "Hospital emergency department intake, bed and ICU occupancy"
    variables:
      bed_occupancy_pct: { unit: "%", min: 20.0, max: 150.0, default: 72.0, physical_max: 150.0 }
      icu_occupancy_pct: { unit: "%", min: 10.0, max: 150.0, default: 65.0, physical_max: 150.0 }
      ed_arrivals_per_h: { unit: "patients/h", min: 0.0, max: 120.0, default: 14.0, physical_max: 200.0 }
      generator_hours_rem: { unit: "h", min: 0.0, max: 72.0, default: 48.0, physical_max: 168.0 }

  HLT:
    description: "Syndromic surveillance and epidemic epidemiology"
    variables:
      ed_syndromic_count: { unit: "cases/day", min: 0.0, max: 500.0, default: 5.0, physical_max: 1000.0 }
      rt: { unit: "reproduction", min: 0.2, max: 6.0, default: 0.95, physical_max: 10.0 }
      doubling_time_days: { unit: "days", min: 0.5, max: 100.0, default: 45.0, physical_max: 365.0 }

  AIR:
    description: "Toxic plumes, chemical vapor, and particulate dispersion"
    variables:
      concentration_index: { unit: "index", min: 0.0, max: 10.0, default: 0.05, physical_max: 50.0 }
      aqi: { unit: "aqi", min: 10.0, max: 999.0, default: 85.0, physical_max: 1000.0 }

  SEI:
    description: "Seismic ground motion, aftershocks, structural integrity"
    variables:
      shaking_intensity_mmi: { unit: "MMI", min: 1.0, max: 12.0, default: 1.0, physical_max: 12.0 }
      aftershock_rate_per_h: { unit: "events/h", min: 0.0, max: 60.0, default: 0.0, physical_max: 200.0 }
      damage_index: { unit: "index", min: 0.0, max: 1.0, default: 0.0, physical_max: 1.0 }

  COM:
    description: "Cellular telecommunication, emergency dispatch radios, citizen reports"
    variables:
      network_load_pct: { unit: "%", min: 5.0, max: 150.0, default: 40.0, physical_max: 150.0 }
      citizen_reports_rate: { unit: "reports/h", min: 0.0, max: 500.0, default: 3.0, physical_max: 2000.0 }
