  - { from: "HYD", to: "PWR", lag_h: 4, mechanism: "physical", description: "Substation inundation triggers regional power loss" }
  - { from: "HYD", to: "TRF", lag_h: 3, mechanism: "physical", description: "Waterlogged roads obstruct emergency transit" }
