id: "heat"
name: "Extreme Humid Heat-Dome & Grid Stress"
lead_semantics: "Real lead: 3–5 days from temperature/humidity forecast; load and hospital effects lag"
honest_statement: "Atmospheric weather models provide high-confidence thermal anomaly predictions 3 to 5 days ahead. The system forecasts the delayed surge in electrical substation overload and lagging heatstroke hospital admissions."
primary_layers: ["WX", "PWR", "HLT", "HOS", "COM"]
trigger_generator:
  event_type: "humid_heat_dome"
  onset_hour: 48
  duration_h: 96
  peak_temp_c: 44.5
  peak_wbgt_c: 34.2
critical_event:
  condition: "wbgt_c >= 32.0 for >= 3 h AND ed_arrivals_per_h >= 28.0"
expected_chain:
